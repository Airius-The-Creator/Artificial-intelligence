<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airius AI App</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00ffaa"><style>body{font-family:Arial;background:#0f0f0f;color:#fff;padding:15px;max-width:600px;margin:auto}h1{text-align:center;color:#00ffaa}.card{background:#1e1e1e;padding:12px;border-radius:12px;margin:12px 0}input,textarea,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}button{background:#00ffaa;color:#000;font-weight:bold}img,video{width:100%;border-radius:8px;margin-top:8px}</style></head><body><h1>🤖 Airius AI</h1><div class="card"><h3>🎨 Photo</h3><input id="imgPrompt" placeholder="Ex: anime girl in Cebu"><button onclick="genImage()">Generate</button><img id="imgResult"></div><div class="card"><h3>🎥 Video</h3><input id="vidPrompt" placeholder="Ex: car drifting"><button onclick="genVideo()">Generate</button><video id="vidResult" controls></video></div><div class="card"><h3>📐 Math & Science</h3><textarea id="mathPrompt" placeholder="Ex: Solve 2x+5=15"></textarea><button onclick="solveMath()">Solve</button><p id="mathResult"></p></div><script>function genImage(){let p=document.getElementById('imgPrompt').value;if(!p)return alert('Lagay prompt');document.getElementById('imgResult').src=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?nologo=1&width=512&height=512&seed=${Date.now()}`}function genVideo(){let p=document.getElementById('vidPrompt').value;if(!p)return alert('Lagay prompt');let v=document.getElementById('vidResult');v.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?model=video`;v.load()}async function solveMath(){let q=document.getElementById('mathPrompt').value;if(!q)return alert('Lagay problem');let r=document.getElementById('mathResult');r.innerText='Solving...';try{let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent("Solve step by step, Tagalog+English: "+q)}`);r.innerText=await res.text()}catch{r.innerText='Error, try ulit'}}</script></body></html>
